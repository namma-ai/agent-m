name: namma-ai agent-m
services:
 frontend:
   build: ./frontend
   container_name: agentic-frontend
   ports:
     - "13001:3000"
   depends_on:
     - api-gateway
   networks:
     - agentic-network
 auth-service:
   build: ./auth-service
   container_name: agentic-auth-service
   ports:
     - "13002:8001"
   environment:
    KEYCLOAK_URL: http://localhost:8080
    REALM_NAME: myrealm
    CLIENT_ID: auth-service
    CLIENT_SECRET: dZrECoRlN2MlCdagmnuFgZxM3Q2L0qrh
   depends_on: ["keycloak"]
   networks:
     - agentic-network

 api-gateway:
   build: ./api-gateway
   container_name: agentic-api-gateway
   ports:
     - "13003:3001"
   depends_on:
     - workflow-orchestrator
   networks:
     - agentic-network
 workflow-orchestrator:
   build: ./workflow-orchestrator
   container_name: agentic-workflow
   ports:
     - "13004:5000"
   depends_on:
     - temporal
   networks:
     - agentic-network
 logging:
   build: ./logging
   container_name: agentic-logging
   ports:
     - "13006:5601"
     - "13007:9200"
   networks:
     - agentic-network
 websocket-service:
   build: ./websocket-service
   container_name: agentic-websocket
   ports:
     - "13008:5000"
   networks:
     - agentic-network
 ai-processor:
   build: ./ai-processor
   container_name: agentic-ai-processor
   ports:
     - "13009:5000"
   networks:
     - agentic-network
 ai-action-service:
   build: ./ai-action-service
   container_name: agentic-ai-action-service
   ports:
     - "13010:5000"
   networks:
     - agentic-network  
 ai-prompt-service:
   build: ./ai-prompt-service
   container_name: agentic-ai-prompt-service
   ports:
     - "13011:5000"
   networks:
     - agentic-network  
 data-preprocessing:
   build: ./data-preprocessing
   container_name: agentic-data-preprocessor
   ports:
     - "13012:5000"
   networks:
     - agentic-network
 storage:
   image: minio/minio
   container_name: agentic-storage
   ports:
     - "9000:9000"
     - "9001:9001"
   command: server /data --console-address ":9001"
   networks:
     - agentic-network
 task-queue:
   build: ./task-queue
   container_name: agentic-task-queue
   depends_on:
     - redis
   networks:
     - agentic-network
 rabbitmq:
   image: rabbitmq:3-management
   container_name: rabbitmq
   ports:
     - '5672:5672'    # AMQP protocol port
     - '15672:15672'  # Management UI port
   environment:
     RABBITMQ_DEFAULT_USER: guest
     RABBITMQ_DEFAULT_PASS: guest
   volumes:
     - rabbitmq_data:/var/lib/rabbitmq
   networks:
     - agentic-network
 redis:
   image: redis:alpine
   container_name: agentic-redis
   ports:
     - "6379:6379"
   networks:
     - agentic-network
 database:
   image: postgres:15
   container_name: agentic-db
   environment:
     POSTGRES_DB: agentic_db
     POSTGRES_USER: admin
     POSTGRES_PASSWORD: admin
   ports:
     - "5432:5432"
   networks:
     - agentic-network
 vector-db:
   image: ankane/pgvector
   container_name: agentic-vector-db
   environment:
     POSTGRES_DB: vector_db
     POSTGRES_USER: admin
     POSTGRES_PASSWORD: admin
   ports:
     - "5433:5432"
   networks:
     - agentic-network
 keycloak:
   image: quay.io/keycloak/keycloak:24.0  
   container_name: agentic-keycloak
   command: start-dev
   environment:
     KEYCLOAK_ADMIN: admin
     KEYCLOAK_ADMIN_PASSWORD: admin
     KC_HOSTNAME: localhost
     KC_HOSTNAME_PORT: 8080
     KC_FRONTEND_URL: http://localhost:8080
     KC_HOSTNAME_STRICT: "false"
     KC_HTTP_ENABLED: "true"
     KC_HEALTH_ENABLED: "true"
     KC_LOG_LEVEL: info
     KC_PROXY_HEADERS: forwarded
     KC_HOSTNAME_DEBUG: "true"
   ports:
     - "8080:8080"
   healthcheck:
     test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
     interval: 30s
     timeout: 10s
     retries: 3

   networks:
     - agentic-network
 temporal:
   image: temporalio/auto-setup:latest
   container_name: temporal-server
   ports:
     - "7233:7233"
   networks:
     - agentic-network
networks:
 agentic-network:
   driver: bridge
volumes:
  rabbitmq_data:
